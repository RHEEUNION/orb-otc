<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE',sans-serif">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { fill: #f6f1de; stroke: #2b8f8a; stroke-width: 2.2; }
      .off { fill: #efece1; stroke: #8fa9a7; stroke-width: 2; stroke-dasharray: 8 6; }
      .title { font-size: 15px; font-weight: 700; fill: #17383a; text-anchor: middle; }
      .sub { font-size: 12px; fill: #45605f; text-anchor: middle; }
      .edge { fill: none; stroke: #b3261e; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arr); }
      .dash { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 7 6; stroke-linecap: round; marker-end: url(#arr); }
      .lbl { font-size: 11.5px; fill: #8a1c16; }
      .zone { fill: none; stroke: #2b8f8a; stroke-width: 1.6; stroke-dasharray: 7 6; }
      .zonelbl { font-size: 12px; fill: #2b8f8a; }
      .head { font-size: 17px; font-weight: 700; fill: #17383a; }
    </style>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>
  <text class="head" x="30" y="34">ORB.OTC architecture</text>

  <!-- Orbinum chain zone -->
  <g filter="url(#rough)"><rect class="zone" x="640" y="52" width="340" height="468" rx="14"/></g>
  <text class="zonelbl" x="810" y="74" text-anchor="middle">Orbinum chain · testnet 2700 → mainnet 270</text>

  <!-- boxes -->
  <g filter="url(#rough)">
    <rect class="box" x="30" y="100" width="190" height="72"/>
    <rect class="box" x="30" y="260" width="190" height="84"/>
    <rect class="box" x="30" y="430" width="190" height="96"/>
    <rect class="box" x="350" y="110" width="200" height="72"/>
    <rect class="box" x="350" y="260" width="200" height="84"/>
    <rect class="off" x="350" y="430" width="200" height="96"/>
    <rect class="box" x="680" y="96" width="260" height="76"/>
    <rect class="box" x="680" y="230" width="260" height="104"/>
    <rect class="box" x="680" y="392" width="260" height="84"/>
    <rect class="box" x="680" y="560" width="260" height="70"/>
  </g>

  <text class="title" x="125" y="128">Wallets</text>
  <text class="sub" x="125" y="148">MetaMask · Rabby · Talisman</text>
  <text class="sub" x="125" y="164">any EIP-6963 wallet</text>

  <text class="title" x="125" y="292">Web UI</text>
  <text class="sub" x="125" y="312">static site, no backend</text>
  <text class="sub" x="125" y="328">order book · fills · fees</text>

  <text class="title" x="125" y="458">Browser modules</text>
  <text class="sub" x="125" y="478">note builder (public keys)</text>
  <text class="sub" x="125" y="494">receipts · one-time address</text>
  <text class="sub" x="125" y="510">never holds a spending key</text>

  <text class="title" x="450" y="138">Operator</text>
  <text class="sub" x="450" y="158">admin CLI · multisig later</text>
  <text class="sub" x="450" y="174">pause · blocklist · fees</text>

  <text class="title" x="450" y="292">Orbinum RPC</text>
  <text class="sub" x="450" y="312">JSON-RPC</text>
  <text class="sub" x="450" y="328">reads every 8s · sends txs</text>

  <text class="title" x="450" y="458">Other EVM networks</text>
  <text class="sub" x="450" y="478">Ethereum · BNB · Arbitrum</text>
  <text class="sub" x="450" y="494">Base · Polygon</text>
  <text class="sub" x="450" y="510">USDT/USDC balances, read only</text>

  <text class="title" x="810" y="124">Quote tokens</text>
  <text class="sub" x="810" y="144">tUSD on testnet</text>
  <text class="sub" x="810" y="160">USDT and USDC on mainnet</text>

  <text class="title" x="810" y="262">OrbOTCV2 contract</text>
  <text class="sub" x="810" y="282">ORB escrow · partial fills · cancel</text>
  <text class="sub" x="810" y="298">maker/taker fees · quote whitelist</text>
  <text class="sub" x="810" y="314">pause · blocklist · private fill</text>

  <text class="title" x="810" y="420">ShieldedPool precompile</text>
  <text class="sub" x="810" y="440">0x…0801</text>
  <text class="sub" x="810" y="456">shield(commitment, memo)</text>

  <text class="title" x="810" y="590">Orbinum Hub</text>
  <text class="sub" x="810" y="610">Recover Notes finds your</text>
  <text class="sub" x="810" y="626">private ORB note</text>

  <!-- edges -->
  <g filter="url(#rough)">
    <!-- UI <-> wallet -->
    <path class="edge" d="M125 258 L125 176"/>
    <!-- wallet -> RPC (signed tx) -->
    <path class="edge" d="M222 136 L292 136 L292 288 L346 288"/>
    <!-- UI -> RPC (reads) -->
    <path class="edge" d="M222 326 L346 326"/>
    <!-- UI -> browser modules -->
    <path class="edge" d="M125 346 L125 426"/>
    <!-- browser modules -> other networks (off) -->
    <path class="dash" d="M222 478 L346 478"/>
    <!-- operator -> RPC -->
    <path class="edge" d="M450 184 L450 256"/>
    <!-- RPC -> contract -->
    <path class="edge" d="M552 290 L676 282"/>
    <!-- contract -> tokens -->
    <path class="edge" d="M810 228 L810 176"/>
    <!-- contract -> precompile -->
    <path class="edge" d="M810 336 L810 388"/>
    <!-- precompile -> hub -->
    <path class="edge" d="M810 478 L810 556"/>
  </g>

  <text class="lbl" x="134" y="222">1 · request signature</text>
  <text class="lbl" x="232" y="124">2 · signed tx</text>
  <text class="lbl" x="232" y="344">read orders</text>
  <text class="lbl" x="134" y="392">runs in the browser</text>
  <text class="lbl" x="232" y="472">mainnet only</text>
  <text class="lbl" x="460" y="228">admin txs</text>
  <text class="lbl" x="566" y="270">call</text>
  <text class="lbl" x="820" y="206">transferFrom / transfer</text>
  <text class="lbl" x="820" y="366">private fill</text>
  <text class="lbl" x="820" y="524">note is public data</text>

  <!-- legend -->
  <rect x="30" y="596" width="26" height="16" rx="3" class="box"/>
  <text class="lbl" x="66" y="609">active on testnet</text>
  <rect x="200" y="596" width="26" height="16" rx="3" class="off"/>
  <text class="lbl" x="236" y="609">prepared, switched off until mainnet</text>
  <text class="lbl" x="30" y="640">The site never holds keys or funds. Funds sit in the escrow contract; the operator can pause trading but cannot move funds.</text>
</svg>
