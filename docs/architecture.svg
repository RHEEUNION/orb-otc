<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE',sans-serif">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { fill: #f6f1de; stroke: #2b8f8a; stroke-width: 2.2; }
      .title { font-size: 15px; font-weight: 700; fill: #17383a; text-anchor: middle; }
      .sub { font-size: 12px; fill: #45605f; text-anchor: middle; }
      .edge { fill: none; stroke: #b3261e; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arr); }
      .lbl { font-size: 11.5px; fill: #8a1c16; }
      .zone { fill: none; stroke: #2b8f8a; stroke-width: 1.6; stroke-dasharray: 7 6; }
      .zonelbl { font-size: 12px; fill: #2b8f8a; }
    </style>
  </defs>

  <rect width="820" height="460" fill="#ffffff"/>

  <!-- on-chain zone -->
  <g filter="url(#rough)">
    <rect class="zone" x="548" y="118" width="252" height="300" rx="14"/>
  </g>
  <text class="zonelbl" x="674" y="140" text-anchor="middle">Orbinum Testnet · chain 2700</text>

  <!-- boxes -->
  <g filter="url(#rough)">
    <rect class="box" x="28" y="196" width="180" height="68"/>
    <rect class="box" x="268" y="36" width="200" height="68"/>
    <rect class="box" x="268" y="330" width="200" height="68"/>
    <rect class="box" x="568" y="164" width="212" height="68"/>
    <rect class="box" x="568" y="330" width="212" height="68"/>
  </g>

  <text class="title" x="118" y="226">Web UI</text>
  <text class="sub" x="118" y="246">order book · create · fill</text>

  <text class="title" x="368" y="66">EVM Wallet</text>
  <text class="sub" x="368" y="86">sign · add / switch chain</text>

  <text class="title" x="368" y="360">Orbinum RPC</text>
  <text class="sub" x="368" y="380">JSON-RPC · read &amp; broadcast</text>

  <text class="title" x="674" y="194">tUSD Token</text>
  <text class="sub" x="674" y="214">quote asset · faucet</text>

  <text class="title" x="674" y="360">OrbOTC Contract</text>
  <text class="sub" x="674" y="380">escrow · partial fills · cancel</text>

  <!-- edges -->
  <g filter="url(#rough)">
    <path class="edge" d="M150 194 C 190 130, 220 80, 264 72"/>
    <path class="edge" d="M150 266 C 190 320, 220 356, 264 362"/>
    <path class="edge" d="M368 106 L 368 326"/>
    <path class="edge" d="M470 364 L 564 364"/>
    <path class="edge" d="M674 328 L 674 236"/>
  </g>

  <text class="lbl" x="128" y="128" transform="rotate(-38 128 128)">1 · request signature</text>
  <text class="lbl" x="382" y="220">2 · signed tx</text>
  <text class="lbl" x="74" y="352">read orders</text>
  <text class="lbl" x="74" y="368">(poll every 8s)</text>
  <text class="lbl" x="476" y="352">3 · call</text>
  <text class="lbl" x="686" y="290">transferFrom / transfer</text>
</svg>
